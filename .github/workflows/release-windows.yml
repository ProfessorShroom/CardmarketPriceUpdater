name: Release Windows Build

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/Avalonia/Cardmarket-Price-Updater.App.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish-win-x64

      - name: Stage executable
        shell: pwsh
        run: |
          Copy-Item "publish-win-x64/Cardmarket-Price-Updater.exe" "CardmarketPriceUpdater.exe"

      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          name: "Cardmarket Price Updater ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'b') }}
          files: CardmarketPriceUpdater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-xml:
    needs: build
    if: ${{ !contains(github.ref_name, 'b') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to main, keeping the tagged project file
        run: |
          git checkout -B main origin/main
          git checkout "$GITHUB_SHA" -- src/Avalonia/Cardmarket-Price-Updater.App.csproj
          git reset -q

      - name: Update update.xml
        run: python3 scripts/update_xml.py "$GITHUB_REF_NAME"

      - name: Commit update.xml
        run: |
          git checkout -- src/Avalonia/Cardmarket-Price-Updater.App.csproj
          git add update.xml
          if git diff --cached --quiet; then
            echo "update.xml unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update update.xml to ${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 5
          done
