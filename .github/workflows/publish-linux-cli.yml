name: Publish Linux CLI build

# Runs on the same tag push as your Flatpak workflow (v*.*.*.*), so pushing
# one tag (e.g. v2.0.3.0) drives the exe, the .flatpak, and this linux-x64
# CLI tarball onto the same release.
#
# Publishes a self-contained linux-x64 build as a plain tarball, separate
# from the .flatpak bundle, so headless/server users can grab a binary
# directly without needing flatpak or any runtime installed at all.
#
# This is safe to run standalone: the CLI path in Program.cs (RunCli)
# never touches Avalonia/BuildAvaloniaApp, so this build works with no
# X11/Wayland and no GUI libraries present on the target machine.

on:
  push:
    tags:
      - 'v*.*.*.*'

jobs:
  publish-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/Avalonia/Cardmarket-Price-Updater.App.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish-linux-x64

      - name: Package tarball
        run: |
          tar -C publish-linux-x64 -czf CardmarketPriceUpdater-linux-x64.tar.gz .

      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          # github.ref_name is the pushed tag, e.g. v2.0.3.0 - this attaches
          # to the release for that tag, creating it if it doesn't exist yet
          # (so it doesn't matter whether this job or another one runs first).
          tag_name: ${{ github.ref_name }}
          name: "Cardmarket Price Updater ${{ github.ref_name }}"
          files: CardmarketPriceUpdater-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
