name: Publish Linux CLI build

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  publish-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/Avalonia/Cardmarket-Price-Updater.App.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish-linux-x64

      - name: Package tarball
        run: |
          tar -C publish-linux-x64 -czf CardmarketPriceUpdater-linux-x64.tar.gz .

      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          # github.ref_name is the pushed tag, e.g. v2.0.3.0 - this attaches
          # to the release for that tag, creating it if it doesn't exist yet
          # (so it doesn't matter whether this job or another one runs first).
          tag_name: ${{ github.ref_name }}
          name: "Cardmarket Price Updater ${{ github.ref_name }}"
          files: CardmarketPriceUpdater-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
